[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/r?pid=:splat"
  status = 302
  force = true


[[redirects]]
  from = "/en/qr.html"
  to = "/en/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/de/qr.html"
  to = "/de/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/ar/qr.html"
  to = "/ar/index.html"
  status = 301
  force = true

# --- Mietwagen/Autovermietung deaktiviert (2026-08-22) ---
# Die Seiten bleiben im Projekt, sind aber ueber die Website nicht erreichbar.
# Zum Reaktivieren: diese drei Redirect-Bloecke entfernen, in de/en/ar
# car-rental.html das robots-Meta wieder auf "index, follow" setzen und die
# auskommentierten Nav-Links in package-tours.html freigeben.
[[redirects]]
  from = "/de/car-rental.html"
  to = "/de/index.html"
  status = 302
  force = true

[[redirects]]
  from = "/en/car-rental.html"
  to = "/en/index.html"
  status = 302
  force = true

[[redirects]]
  from = "/ar/car-rental.html"
  to = "/ar/index.html"
  status = 302
  force = true

# --- Platzhalterseiten -> echte Apps (2026-08-22) ---
# de/tages-touren.html, */day-tours.html und */airport-transfer.html sind noch
# leere Platzhalter. Bis sie mit Inhalt gefuellt sind, gehen die URLs auf die
# produktiven Apps, damit niemand auf einer leeren Seite landet.
[[redirects]]
  from = "/de/tages-touren.html"
  to = "https://tours.amd-germancenter.com/index.html"
  status = 302
  force = true

[[redirects]]
  from = "/en/day-tours.html"
  to = "https://tours.amd-germancenter.com/index.html"
  status = 302
  force = true

[[redirects]]
  from = "/ar/day-tours.html"
  to = "https://tours.amd-germancenter.com/index.html"
  status = 302
  force = true

[[redirects]]
  from = "/de/airport-transfer.html"
  to = "https://transfer.amd-germancenter.com/booking"
  status = 302
  force = true

[[redirects]]
  from = "/en/airport-transfer.html"
  to = "https://transfer.amd-germancenter.com/booking"
  status = 302
  force = true

[[redirects]]
  from = "/ar/airport-transfer.html"
  to = "https://transfer.amd-germancenter.com/booking"
  status = 302
  force = true

